; =============================================================================
; SD Logger V3 — PlatformIO project configuration
; MCU: STM32F405RGT6 (WeAct core, LQFP64) · 1024 KB Flash · 128 KB D1 + 64 KB CCM
;
; Closes repo preconditions §10.2.1:
;   P2 — platform/HAL pinned  (Docs/03-TEST-PLAN.md §10.2.1 P2)
;   P3 — env:release with -O2 (Docs/03-TEST-PLAN.md §10.2.1 P3)
; Clock contract implemented by this configuration: §2.2 (HSE 8 MHz crystal).
; =============================================================================

[platform]
name = SDloggerV3_1

; -----------------------------------------------------------------------------
; [common] — NOT an environment: it is pulled in only through "extends", so the
; two environments below can never drift apart on platform/board/framework/HSE.
; -----------------------------------------------------------------------------
[common]
; P2 (§10.2.1): the platform is PINNED, never floating.
; ststm32 19.1.0 is a real published release (git tag v19.1.0, commit eb98d12,
; released 26 Mar 2025). Its platform.json requires framework-stm32cubef4
; "~1.28.1", which resolves to HAL 1.28.3 — the version .clinerules claims,
; now actually true in the build (P2 acceptance: HAL_GetVersion() at BOOT).
platform = ststm32@19.1.0
board = genericSTM32F405RG
framework = stm32cube

; Bench flashing: the WeAct F405RG core is flashed over SWD with a WeAct ST-Link
; (§2.1 "Debug | UART/SWD"). The generic board definition defaults to
; upload.protocol = "serial", so `pio run -t upload` would look for a bootloader
; serial port that does not exist on this board. "stlink" is one of the protocols
; the pinned board JSON declares (ststm32 19.1.0, boards/genericSTM32F405RG.json:
; blackmagic, dfu, jlink, serial, stlink; openocd_target = "stm32f4x") and is
; served by the installed tool-openocd uploader. Declared in [common] so both
; environments flash identically — release binary and debug binary from the same
; probe, no silent protocol difference between envs.
upload_protocol = stlink

; The board JSON declares build.f_cpu = 168000000L, and the stm32cube builder
; feeds it to the compiler as ("F_CPU", "$BOARD_F_CPU") -> -DF_CPU=168000000L.
; This project runs at a CONSTANT 84 MHz (§2.2, "no dynamic PLL switching"). HAL
; ignores F_CPU (every bus clock is derived from RCC), but any future code that
; trusts F_CPU — a delay loop, bit-bang timing, a baud divider — would be exactly
; 2x wrong. Corrected here so the macro matches the frozen §2.2 clock tree.
board_build.f_cpu = 84000000L

; OpenOCD transport override — verified on the bench, required on this machine.
; ststm32 19.1.0 hard-codes the ST-Link server arguments, including
; "-c transport select hla_swd" (platforms/ststm32/19.1.0/platform.py:197-202),
; but the pinned tool-openocd @ 3.1200.7 (0.12.0) resolves interface/stlink.cfg
; to the modern "st-link" driver, which offers jtag/swd/swim only (its
; interface/stlink.cfg:13-17 explicitly returns when an hla adapter is selected).
; The bench attempt therefore died before touching the chip:
;   Debug adapter doesn't support 'hla_swd' transport ... *** [upload] Error 1
; Both overrides below keep upload_protocol = stlink semantics but use the driver
; that actually enumerates the WeAct ST-Link (STLINK V2J46M32 API v2,
; VID:PID 0483:3752, target VDD measured 3.230 V, SWD DPIDR 0x2ba01477,
; Cortex-M4 r0p1, 6 hardware breakpoints / 4 watchpoints, SWD clock 1.8 MHz —
; openocd cannot reach the 2 MHz the target cfg requests).
; "swd" = the dapdirect transport of the st-link driver. The target file is the
; board's own openocd_target "stm32f4x", which builds
; flash bank stm32f4x.flash stm32f2x @ 0x08000000 (device id 0x101f6413:
; DEV_ID 0x6413 = STM32F40x family, 1024 KiB, 12 sectors, all "not protected").
; "exit" is used instead of "shutdown": "shutdown" is not a keyword of the
; program command and produced "Error: Invalid command argument" on the bench.
; upload_command replaces the builder's generated openocd argument list
; (platforms/ststm32/19.1.0/builder/main.py:313-335); program/verify/reset
; semantics are unchanged. $BUILD_DIR is forward-slash already and cwd = project
; root, so the path needs no escaping.
upload_command = ${platformio.packages_dir}/tool-openocd/bin/openocd.exe -s ${platformio.packages_dir}/tool-openocd/openocd/scripts -f interface/stlink.cfg -c "transport select swd" -f target/stm32f4x.cfg -c "program {$BUILD_DIR/firmware.elf} verify reset exit"

; Same corrected server command for GDB-based debugging (pio debug, VS Code debug
; button). debug_tool = stlink in [env:debug] selects the probe; debug_server
; replaces the same broken generated arguments for the debug path.
; Format note (verified against platformio/debug/config/base.py:33,175-182): the
; CLI reads this option from platformio.ini as a LIST - one argv token per line,
; element [0] is the executable - so each line must hold exactly one token, and a
; "-c" value may contain spaces in its own element. That is the same shape the
; platform itself builds (ststm32 platform.py:189-211), minus the bad transport.
; $PROJECT_PACKAGES_DIR is the SCons/ProjectConfig variable for the global
; packages folder (builder/main.py:119); $PackagesDir is NOT a valid name and
; produced "The system cannot find the path specified." on the first bench try.
debug_server =
    ${platformio.packages_dir}/tool-openocd/bin/openocd.exe
    -s
    ${platformio.packages_dir}/tool-openocd/openocd/scripts
    -f
    interface/stlink.cfg
    -c
    transport select swd
    -f
    target/stm32f4x.cfg

; HSE is an 8 MHz crystal per BOM (§2.1, §2.2). The generic board JSON declares
; no HSE value, and the vendored HAL defaults to 25000000U behind
; "#if !defined(HSE_VALUE)" (stm32f4xx_hal_conf_template.h:94). A command-line
; -D therefore wins with no redefinition warning. Without this flag, PLLM=8
; would produce a 3.125 MHz reference instead of 1 MHz and every target in
; §2.2 would be 3.125x wrong (SYSCLK 262.5 MHz = out of spec).
build_flags =
    -DHSE_VALUE=8000000

; PlatformIO's DefaultEnvironment appends its OWN optimisation level (-Os) AFTER
; the user's build_flags, and GCC honours the LAST -O on the command line:
;   release cc_flags = -O2 -mthumb -mcpu=cortex-m4 -Os -ffunction-sections ...
; Without removing -Os, env:release silently builds at -Os instead of -O2
; (measured: main.o came out byte-identical in both envs). P3 requires a real
; -O2 build, so -Os is unflagged and each environment states its own -O level.
build_unflags = -Os

; P1 (§10.2.1): NO lib_deps yet — FatFs R0.12c is vendored into lib/ later.
; P4 (§10.2.1): NO custom linker script yet — .d1ram + ASSERT is the next step.
; Until then the builder links with the package script
; tool-ldscripts-ststm32/STM32F4/STM32F405RGTX_FLASH.ld (matched automatically).

; -----------------------------------------------------------------------------
; env:release — the campaign build. Every CPU figure in §9 and the K8 acceptance
; band are quoted for -O2; without this env there is no build those numbers
; describe (P3, §10.2.1).
; -----------------------------------------------------------------------------
[env:release]
extends = common
; ${common.build_flags} is written out explicitly: PlatformIO does NOT reliably
; merge a parent section's build_flags when the child declares its own, and a
; silently dropped -DHSE_VALUE would ship a 25 MHz HSE assumption (SYSCLK
; 262.5 MHz). The #error guards in src/main.c are the backstop.
build_flags =
    ${common.build_flags}
    -O2
build_unflags = ${common.build_unflags}

; -----------------------------------------------------------------------------
; env:debug — bench bring-up build. -Og optimizes for debuggability (variables
; stay visible, order preserved), -g3 emits full debug info including macros.
; -----------------------------------------------------------------------------
[env:debug]
extends = common
build_flags =
    ${common.build_flags}
    -Og
    -g3
build_unflags = ${common.build_unflags}
; GDB attach for `pio debug -e debug`: openocd with the stlink interface and the
; board's openocd_target "stm32f4x". Declared per-environment (not in [common])
; because the release env is a campaign binary, not a debug session target.
; SVD for register inspection comes from the pinned platform:
; .platformio/platforms/ststm32@19.1.0/misc/svd/STM32F40x.svd.
debug_tool = stlink
