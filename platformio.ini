; =============================================================================
; SD Logger V3 — PlatformIO project configuration
; MCU: STM32F405RGT6 (WeAct core, LQFP64) · 1024 KB Flash · 128 KB D1 + 64 KB CCM
;
; Closes repo preconditions §10.2.1:
;   P2 — platform/HAL pinned  (Docs/03-TEST-PLAN.md §10.2.1 P2)
;   P3 — env:release with -O2 (Docs/03-TEST-PLAN.md §10.2.1 P3)
; Clock contract implemented by this configuration: §2.2 (HSE 8 MHz crystal).
; =============================================================================

[platform]
name = SDloggerV3_1

; -----------------------------------------------------------------------------
; [common] — NOT an environment: it is pulled in only through "extends", so the
; two environments below can never drift apart on platform/board/framework/HSE.
; -----------------------------------------------------------------------------
[common]
; P2 (§10.2.1): the platform is PINNED, never floating.
; ststm32 19.1.0 is a real published release (git tag v19.1.0, commit eb98d12,
; released 26 Mar 2025). Its platform.json requires framework-stm32cubef4
; "~1.28.1", which resolves to HAL 1.28.3 — the version .clinerules claims,
; now actually true in the build (P2 acceptance: HAL_GetVersion() at BOOT).
platform = ststm32@19.1.0
board = genericSTM32F405RG
framework = stm32cube

; HSE is an 8 MHz crystal per BOM (§2.1, §2.2). The generic board JSON declares
; no HSE value, and the vendored HAL defaults to 25000000U behind
; "#if !defined(HSE_VALUE)" (stm32f4xx_hal_conf_template.h:94). A command-line
; -D therefore wins with no redefinition warning. Without this flag, PLLM=8
; would produce a 3.125 MHz reference instead of 1 MHz and every target in
; §2.2 would be 3.125x wrong (SYSCLK 262.5 MHz = out of spec).
build_flags =
    -DHSE_VALUE=8000000

; PlatformIO's DefaultEnvironment appends its OWN optimisation level (-Os) AFTER
; the user's build_flags, and GCC honours the LAST -O on the command line:
;   release cc_flags = -O2 -mthumb -mcpu=cortex-m4 -Os -ffunction-sections ...
; Without removing -Os, env:release silently builds at -Os instead of -O2
; (measured: main.o came out byte-identical in both envs). P3 requires a real
; -O2 build, so -Os is unflagged and each environment states its own -O level.
build_unflags = -Os

; P1 (§10.2.1): NO lib_deps yet — FatFs R0.12c is vendored into lib/ later.
; P4 (§10.2.1): NO custom linker script yet — .d1ram + ASSERT is the next step.
; Until then the builder links with the package script
; tool-ldscripts-ststm32/STM32F4/STM32F405RGTX_FLASH.ld (matched automatically).

; -----------------------------------------------------------------------------
; env:release — the campaign build. Every CPU figure in §9 and the K8 acceptance
; band are quoted for -O2; without this env there is no build those numbers
; describe (P3, §10.2.1).
; -----------------------------------------------------------------------------
[env:release]
extends = common
; ${common.build_flags} is written out explicitly: PlatformIO does NOT reliably
; merge a parent section's build_flags when the child declares its own, and a
; silently dropped -DHSE_VALUE would ship a 25 MHz HSE assumption (SYSCLK
; 262.5 MHz). The #error guards in src/main.c are the backstop.
build_flags =
    ${common.build_flags}
    -O2
build_unflags = ${common.build_unflags}

; -----------------------------------------------------------------------------
; env:debug — bench bring-up build. -Og optimizes for debuggability (variables
; stay visible, order preserved), -g3 emits full debug info including macros.
; -----------------------------------------------------------------------------
[env:debug]
extends = common
build_flags =
    ${common.build_flags}
    -Og
    -g3
build_unflags = ${common.build_unflags}
